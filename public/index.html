<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dynasty Lab</title>
  <meta name="description" content="Dynasty fantasy football rankings and advanced analytics: YPRR, separation, explosive runs, and Sleeper league power rankings.">
  <meta name="theme-color" content="#2a78d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dynasty Lab">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css" id="app-css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/rankings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="var(--accent)"/><path d="M6 16l4-5 3 3 5-7" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Dynasty Lab
      </a>
      <nav class="tabs" id="nav">
        <a href="#/rankings" data-route="rankings">Rankings</a>
        <a href="#/analytics" data-route="analytics">Analytics</a>
        <a href="#/matchups" data-route="matchups">Matchups</a>
        <a href="#/prospects" data-route="prospects">Prospects</a>
        <a href="#/college" data-route="college">College</a>
        <a href="#/league" data-route="league">League</a>
        <a href="#/about" data-route="about">Methodology</a>
      </nav>
      <div class="controls" id="controls"></div>
    </div>
  </header>
  <div id="banner" class="banner" role="status" hidden></div>
  <main id="app"><div class="empty"><span class="spinner"></span> Loading data…</div></main>
  <div id="tip" role="tooltip"></div>
  <script type="module">
    // Starts the app. On the website every deploy has an id: pipeline/site.mjs stamps it on this page, the stylesheet
    // and every script and data URL, and data/site.json (never cached) names the current one. If it names a newer
    // deploy than this page, this page is a cached copy: reload once to get the new one. So a browser never runs one
    // deploy's code against another deploy's data. On your computer there's no id and nothing is cached.
    const built = document.documentElement.dataset.deploy || null;
    let v = built;
    if (built) {
      try { const r = await fetch('data/site.json', { cache: 'no-store' }); if (r.ok) v = (await r.json()).v || built; } catch { /* offline: this page's own deploy */ }
    }
    let reload = false;
    if (v !== built) { try { reload = sessionStorage.getItem('dl.deploy') !== v; if (reload) sessionStorage.setItem('dl.deploy', v); } catch { /* no storage: never risk a reload loop */ } }
    if (reload) location.reload();
    else {
      if (v !== built) document.getElementById('app-css').href = `css/app.css?v=${v}`;
      import(v ? `./js/main.js?v=${v}` : './js/main.js').catch(e => {
        console.error(e);
        document.getElementById('app').innerHTML = '<div class="empty">Couldn’t load the app. Check your connection and refresh.</div>';
      });
    }
  </script>
</body>
</html>
